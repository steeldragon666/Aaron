# The verification gate, run where the author cannot skip it.
#
# CLAUDE.md §7 says `no-mistakes` gates every push, no exceptions. Run only on
# a developer's machine that is a convention with a CLI attached: whoever is
# pushing decides whether it ran, and an agent pushing on its own is deciding
# about itself. Run here it is a mechanism — the same checks, on a clean
# checkout, reported against the commit whether or not anyone asked.
#
# The intent id is read out of the commit subject rather than passed in, which
# makes the other half of the convention machine-checked too: a commit with no
# decision, spec item or AR id in its subject fails the gate.
#
# This is necessary but not sufficient. A required status check on the default
# branch is what makes it unskippable; without that, a push can still merge red.
# See register/README.md, "Branch protection".

name: no-mistakes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-mistakes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull_request event the checked-out tree is a merge commit
          # Actions built, and its parents are the base tip and the PR head.
          # Depth 2 is what it takes to have the head commit object present, so
          # the gate can read its subject. On push, depth 2 is one more commit
          # than needed and costs nothing.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the register and its dev tooling
        working-directory: register
        # No runtime dependencies by design (CLAUDE.md §2); everything installed
        # here is a checker, none of it reaches a client-context path.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run the gate
        # Reads the intent from the commit subject and fails if there isn't one.
        #
        # Which commit matters. On a pull_request event HEAD is the merge
        # commit Actions built, whose subject is "Merge <head> into <base>" —
        # GitHub's sentence, not the author's, and it carries no intent id. The
        # commit that carries one is the PR head, so name it explicitly and
        # fall back to github.sha for push and workflow_dispatch.
        env:
          INTENT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: tools/no-mistakes --intent-from-commit "$INTENT_REF"

      - name: Show the run log entry
        if: always()
        run: tail -n 1 .no-mistakes/runs.jsonl || true
