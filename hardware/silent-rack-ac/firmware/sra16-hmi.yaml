# SRA-16 touchscreen (CP-SRA16-ELC-001) - Waveshare ESP32-S3-Touch-LCD-4.3B in the pod on the upper door.
#
# Shows the rack and lets you set it, over RS485 Modbus to the rack node (client; the node is
# server 1).  It also reads the room (SHT41 in the pod) and the upper-door reed switch (DI0), sounds
# the alarm buzzer (DO0) and switches the alarm output (DO1, for a beacon) while a serious alarm is
# active.  It sits outside the steel, so it is the one on Wi-Fi: Home Assistant, web page, OTA.
# The cooling keeps running without it: all decisions, and the SHUTDOWN relay, are in the node.

substitutions:
  name: sra16-hmi
  friendly_name: SRA-16 rack

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: carbonproject.sra16-hmi
    version: "1.0.0"
  includes:
    - components/sra_control/sra_control.h

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # GPIO43/44 (UART0) carry the RS485 bus on this board

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3

# ------------------------------------------------------------------ board
i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz

ch422g:
  - id: exio

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: disp
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: touch
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: exio
      number: 1
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

time:
  - platform: pcf85063
    id: rtc
  - platform: sntp
    id: ntp
    on_time_sync:
      - pcf85063.write_time:
          id: rtc

# ------------------------------------------------------------------ RS485 to the rack node
uart:
  id: rs485
  tx_pin: GPIO44
  rx_pin: GPIO43
  baud_rate: 19200

modbus:
  id: mb
  uart_id: rs485
  send_wait_time: 250ms

modbus_controller:
  - id: node
    modbus_id: mb
    address: 1
    update_interval: 2s
    offline_skip_updates: 2
    on_online:
      - lambda: "id(g_link) = true;"
    on_offline:
      - lambda: "id(g_link) = false;"

globals:
  - id: g_link
    type: bool
    initial_value: "false"
  - id: g_beat
    type: uint16_t
    initial_value: "0"
  - id: g_alarm_seen
    type: uint16_t
    initial_value: "0"
  - id: g_silenced
    type: bool
    initial_value: "false"

# temperatures arrive as degC x 10, -32768 when a probe is missing
sensor:
  - {platform: modbus_controller, modbus_controller_id: node, id: n_cold, name: Cold side, register_type: holding, address: 0x00, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_hot, name: Hot side, register_type: holding, address: 0x01, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_cold_top, name: Cold side top, register_type: holding, address: 0x02, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_cold_mid, name: Cold side middle, register_type: holding, address: 0x03, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_supply, name: AC supply air, register_type: holding, address: 0x04, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_hot_top, name: Hot side top, register_type: holding, address: 0x05, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_return, name: AC return air, register_type: holding, address: 0x06, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_exhaust, name: AC exhaust, register_type: holding, address: 0x07, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_rh, name: Cold side humidity, register_type: holding, address: 0x08, value_type: S_WORD, unit_of_measurement: "%", device_class: humidity, accuracy_decimals: 0, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_dew, name: Cold side dew point, register_type: holding, address: 0x09, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_cold_avg, name: Cold side average, register_type: holding, address: 0x0A, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_load_dt, name: Server temperature rise, register_type: holding, address: 0x0B, value_type: S_WORD, unit_of_measurement: "K", accuracy_decimals: 1, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_setpoint, name: AC setpoint sent, register_type: holding, address: 0x0C, value_type: S_WORD, unit_of_measurement: "°C", accuracy_decimals: 0, filters: [{lambda: "return x == -32768 ? NAN : x / 10.0f;"}]}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_state, register_type: holding, address: 0x0D, value_type: U_WORD, internal: true}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_alarms, name: Alarm bits, register_type: holding, address: 0x0E, value_type: U_WORD, accuracy_decimals: 0}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_flags, register_type: holding, address: 0x0F, value_type: U_WORD, internal: true}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_retries, register_type: holding, address: 0x10, value_type: U_WORD, internal: true}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_uptime, register_type: holding, address: 0x11, value_type: U_WORD, internal: true}
  - {platform: modbus_controller, modbus_controller_id: node, id: n_ir_count, name: IR frames sent, register_type: holding, address: 0x12, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic}
  - platform: sht4x
    temperature:
      id: room_t
      name: Room temperature
    humidity:
      id: room_rh
      name: Room humidity
    update_interval: 15s

select:
  - platform: modbus_controller
    modbus_controller_id: node
    id: sel_mode
    name: Cooling mode
    address: 0x20
    value_type: U_WORD
    optionsmap:
      "Auto": 0
      "On": 1
      "Off": 2
  - platform: modbus_controller
    modbus_controller_id: node
    id: sel_fan
    name: AC fan
    address: 0x23
    value_type: U_WORD
    optionsmap:
      "Auto": 0
      "Low": 1
      "High": 2

number:
  - {platform: modbus_controller, modbus_controller_id: node, id: num_target, name: Intake target, address: 0x21, value_type: S_WORD, min_value: 18, max_value: 27, step: 0.5, multiply: 10, unit_of_measurement: "°C"}
  - {platform: modbus_controller, modbus_controller_id: node, id: num_warn, name: Intake warning, address: 0x24, value_type: S_WORD, min_value: 24, max_value: 35, step: 1, multiply: 10, unit_of_measurement: "°C", entity_category: config}
  - {platform: modbus_controller, modbus_controller_id: node, id: num_crit, name: Intake shutdown limit, address: 0x25, value_type: S_WORD, min_value: 28, max_value: 40, step: 1, multiply: 10, unit_of_measurement: "°C", entity_category: config}

switch:
  - platform: modbus_controller
    modbus_controller_id: node
    id: sw_eco
    name: Eco (quiet at low load)
    register_type: holding
    address: 0x22
    bitmask: 1
  - platform: gpio
    id: buzzer
    name: Buzzer
    internal: true
    pin:
      ch422g: exio
      number: 8          # DO0, open drain, sinks the 12 V buzzer
      mode:
        output: true
        open_drain: true
      inverted: true
  - platform: gpio
    id: alarm_out
    name: Alarm output
    internal: true
    pin:
      ch422g: exio
      number: 9          # DO1, open drain: on while a serious alarm is active (12 V beacon)
      mode:
        output: true
        open_drain: true
      inverted: true

binary_sensor:
  - platform: gpio
    id: door_upper
    name: Upper door open
    device_class: door
    pin:
      ch422g: exio
      number: 0          # DI0, reed switch closed when the door is shut
    filters:
      - delayed_on_off: 500ms
  - platform: template
    id: link_ok
    name: Rack node link
    device_class: connectivity
    lambda: "return id(g_link);"
  # alarms for Home Assistant automations (bit order: sra_control.h, enum Alarm)
  - {platform: template, name: "Alarm: intake warning", device_class: heat, lambda: "return ((int) id(n_alarms).state) & sra::AL_COLD_WARN;"}
  - {platform: template, name: "Alarm: intake critical", device_class: heat, lambda: "return ((int) id(n_alarms).state) & sra::AL_COLD_CRIT;"}
  - {platform: template, name: "Alarm: AC not cooling", device_class: problem, lambda: "return ((int) id(n_alarms).state) & sra::AL_NOT_COOLING;"}
  - {platform: template, name: "Alarm: water in tray", device_class: moisture, lambda: "return ((int) id(n_alarms).state) & sra::AL_LEAK;"}
  - {platform: template, name: "Alarm: door left open", device_class: door, lambda: "return ((int) id(n_alarms).state) & sra::AL_DOOR;"}
  - {platform: template, name: "Alarm: probe missing", device_class: problem, lambda: "return ((int) id(n_alarms).state) & sra::AL_SENSOR;"}
  - {platform: template, name: "Alarm: condensation risk", device_class: moisture, lambda: "return ((int) id(n_alarms).state) & sra::AL_CONDENSATION;"}
  - {platform: template, name: "Alarm: AC socket dead", device_class: power, lambda: "return ((int) id(n_alarms).state) & sra::AL_NO_POWER;"}
  - platform: template
    id: shutdown_request
    name: IT shutdown request
    device_class: problem
    lambda: "return ((int) id(n_flags).state) & 4;"

text_sensor:
  - platform: template
    name: Cooling state
    lambda: "return std::string(sra::state_name((uint8_t) id(n_state).state));"
    update_interval: 5s
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: IP address

button:
  - platform: template
    id: btn_send_ir
    name: Re-send state to the AC
    on_press:
      - lambda: |-
          auto *c = id(node);
          c->queue_command(modbus_controller::ModbusCommandItem::create_write_single_command(c, 0x32, 1));
  - platform: template
    id: btn_reset
    name: Reset alarms
    on_press:
      - lambda: |-
          auto *c = id(node);
          c->queue_command(modbus_controller::ModbusCommandItem::create_write_single_command(c, 0x32, 2));
      - script.execute: alarm_silence

script:
  - id: alarm_silence
    then:
      - lambda: "id(g_silenced) = true;"
      - switch.turn_off: buzzer
  - id: beep
    mode: single
    then:
      - repeat:
          count: 3
          then:
            - switch.turn_on: buzzer
            - delay: 120ms
            - switch.turn_off: buzzer
            - delay: 180ms

interval:
  # tell the node about the upper door and the room; the write also serves as its heartbeat
  - interval: 5s
    then:
      - lambda: |-
          auto *c = id(node);
          using MCI = modbus_controller::ModbusCommandItem;
          c->queue_command(MCI::create_write_single_command(c, 0x30, id(door_upper).state ? 1 : 0));
          c->queue_command(MCI::create_write_single_command(c, 0x31, (uint16_t) sra::t10(id(room_t).state)));
          c->queue_command(MCI::create_write_single_command(c, 0x33, ++id(g_beat)));
  # buzzer: beep on a new serious alarm, then every minute until silenced or cleared
  - interval: 2s
    then:
      - lambda: |-
          const uint16_t serious = sra::AL_COLD_CRIT | sra::AL_NOT_COOLING | sra::AL_LEAK | sra::AL_SHUTDOWN |
                                   sra::AL_NO_POWER | sra::AL_COLD_WARN;
          uint16_t a = id(g_link) ? ((uint16_t) id(n_alarms).state & serious) : (uint16_t) sra::AL_LINK;
          if (a & ~id(g_alarm_seen)) id(g_silenced) = false;      // something new: sound again
          id(g_alarm_seen) = a;
          if (a == 0) id(g_silenced) = false;
          if ((a != 0) != id(alarm_out).state) {
            if (a != 0) id(alarm_out).turn_on(); else id(alarm_out).turn_off();
          }
      - if:
          condition:
            lambda: "return id(g_alarm_seen) != 0;"
          then:
            - if:
                condition: lvgl.is_paused
                then:
                  - lvgl.resume:
                  - lvgl.widget.redraw:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: "return id(g_alarm_seen) != 0 && !id(g_silenced);"
          then:
            - script.execute: beep

# screen: sleep after 5 minutes without a touch (wakes on touch or on an alarm)
lvgl:
  on_idle:
    timeout: 300s
    then:
      - if:
          condition:
            lambda: "return id(g_alarm_seen) == 0;"
          then:
            - lvgl.pause:
                show_snow: false

packages:
  ui: !include hmi/ui.yaml
