[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "register"
version = "0.1.0"
description = "Commitment register and hash-chained Action Request ledger — Sprint 1, tenant zero"
requires-python = ">=3.11"
# No runtime dependencies, and this list stays empty for anything on a
# client-context path. CLAUDE.md §2: zero external API dependencies is a
# contractual product claim, not a preference.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
register = "register.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
register = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["register"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
